<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalet T-1860 — Visite 3D complète</title>
<style>
:root{--bg:#0e1412;--panel:rgba(14,20,18,.86);--ink:#f2efe8;--acc:#d9a441}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--panel);backdrop-filter:blur(10px);padding:14px 12px;overflow:auto;z-index:5;transition:transform .3s;box-sizing:border-box}
#ui h1{font-size:15px;margin:2px 4px 10px;font-weight:600}
#ui h1 em{display:block;font-style:normal;font-size:11px;opacity:.65;font-weight:400}
#ui h2{font-size:11px;opacity:.6;margin:12px 6px 4px;text-transform:uppercase;letter-spacing:.08em}
#ui button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
#ui button.on,#ui button:hover{background:rgba(217,164,65,.18)}
#ui label{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 10px}
#tog{position:fixed;left:256px;top:12px;z-index:6;background:var(--panel);color:var(--ink);border:0;border-radius:8px;padding:8px 10px;cursor:pointer;transition:left .3s}
body.closed #ui{transform:translateX(-100%)}body.closed #tog{left:12px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--bg);z-index:10;gap:12px}
#bar{width:260px;height:6px;background:#233;border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--acc)}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:10px;font-size:12px;z-index:5;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#pad{position:fixed;right:16px;bottom:16px;z-index:6;display:none;grid-template-columns:repeat(3,54px);gap:6px}
#pad button{height:54px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);font-size:20px;touch-action:none}
#lvl{position:fixed;right:16px;top:12px;z-index:6;display:flex;gap:6px}
#lvl button{background:var(--panel);color:var(--ink);border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px}
#lvl button.on{background:rgba(217,164,65,.35)}
@media(pointer:coarse){#pad{display:grid}#hint{display:none}#ui{width:210px}#tog{left:216px}}
</style>
</head>
<body class="closed">
<div id="load"><div>Chargement du chalet…</div><div id="bar"><i></i></div><small id="pct">0 %</small></div>
<nav id="ui">
  <h1>Chalet T-1860<em>Modèle complet · plan septembre + design SGDA</em></h1>
  <h2>Points de vue</h2><div id="cams"></div>
  <h2>Options</h2>
  <label><input type="checkbox" id="lights"> Luminaires intérieurs</label>
  <label><input type="checkbox" id="roof" checked> Toit / plafonds</label>
  <label><input type="checkbox" id="fly"> Vol libre (pas de sol)</label>
  <label>Heure <input type="range" id="sun" min="6" max="20" step="0.5" value="17" style="flex:1"></label>
</nav>
<button id="tog">☰</button>
<div id="lvl"><button data-l="rdj">Rez-de-jardin</button><button data-l="rdc" class="on">Rez-de-chaussée</button></div>
<div id="hint">Glisse la souris pour regarder · W A S D ou flèches pour marcher · molette = avancer · Maj = courir</div>
<div id="pad"><i></i><button data-k="w">▲</button><i></i><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const EYE = 1.62;                  // hauteur des yeux (m)
const RDC = 0.0, RDJ = -2.87;      // planchers (m) : 100'-0" et 90'-7"
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.8;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); window.__scene = scene; window.__THREE = THREE;
scene.fog = new THREE.Fog(0xcfd9e0, 120, 1400);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 6000);
scene.add(camera);
const pmrem = new THREE.PMREMGenerator(renderer);
const sun = new THREE.DirectionalLight(0xfff0dc, 3.0);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -55; sc.right = 55; sc.top = 55; sc.bottom = -55; sc.near = 1; sc.far = 400;
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.06;
scene.add(sun); scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x55603a, 0.35); scene.add(hemi);
function setSun(h) {   // lac au nord (-Z three) ; ete : lever NE, coucher NO
  const t = (h - 6) / 14; const az = (60 + t * 240) * Math.PI / 180; const el = Math.sin(t * Math.PI) * 58 * Math.PI / 180 + 3 * Math.PI / 180;
  const r = 250; sun.position.set(r * Math.sin(az) * Math.cos(el), r * Math.sin(el), -r * Math.cos(az) * Math.cos(el));
  const k = Math.sin(t * Math.PI);
  sun.intensity = 0.8 + 3.0 * k;
  sun.color.setHSL(0.085, 0.55, 0.5 + 0.45 * k);
  hemi.intensity = 0.15 + 0.3 * k;
}
setSun(17);
document.getElementById('sun').oninput = e => setSun(+e.target.value);
new RGBELoader().load('sky_2k.hdr', hdr => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  scene.background = hdr;
  scene.environmentIntensity = 0.55;
});
const draco = new DRACOLoader(); draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
const cams = {}; const lights = []; const roofParts = []; const floors = [];
const bar = document.querySelector('#bar i'), pct = document.getElementById('pct');
const FLOOR_RX = /^(FL_|SLAB|TERRAIN|TERR_DECK|TERR_RDJ_SLAB|PERRON|ST_LANDING|ST1_|ST2_|TSTEP|LSTEP|DOCK|SHORE_DECK|ROAD|RUG)/;
loader.load('T-1860-full.glb?v=12', gltf => {
  const root = gltf.scene; scene.add(root);
  root.traverse(o => {
    if (o.isMesh) {
      o.castShadow = !/^(TERRAIN|LAKE|BACKDROP|GUARD_G|G_)/.test(o.name); o.receiveShadow = true;
      if (/^(ROOF|CEIL|BEAM|CHIMNEY|SOFFIT|TBEAM|TRIM)/.test(o.name)) roofParts.push(o);
      if (FLOOR_RX.test(o.name)) floors.push(o);
      if (o.name.startsWith('BACKDROP')) { o.material.fog = false; o.castShadow = false; o.receiveShadow = false; }
      if (o.name.startsWith('LAKE')) { o.material.envMapIntensity = 1.2; }
      if (o.material && o.material.transmission > 0) { o.material.transparent = true; o.material.opacity = 0.35; o.material.transmission = 0; o.material.depthWrite = false; }
    }
    if (o.isLight) { o.visible = false; lights.push(o); if (o.isSpotLight) { o.intensity *= 0.03; o.castShadow = false; } }
    if (o.isCamera) cams[o.name] = o;
  });
  // ---- rive opposee : photo reelle sur un cylindre complet (360, miroir), fondue dans le ciel
  let bd = null; root.traverse(o => { if (o.isMesh && o.name.startsWith('BACKDROP')) bd = o; });
  if (bd) {
    const tex = bd.material.emissiveMap; bd.removeFromParent();
    tex.wrapS = THREE.MirroredRepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping; tex.repeat.set(3, 1); tex.needsUpdate = true;
    const ac = document.createElement('canvas'); ac.width = 4; ac.height = 512; const g = ac.getContext('2d');
    // texture glTF : flipY=false -> v=0 est le HAUT de la photo. vPhoto (depuis le bas) -> uv y = 1 - vPhoto
    const V0 = 0.38, V1 = 0.72;                         // portion verticale de la photo utilisee (depuis le bas)
    const Y0 = -30, Y1 = -30 + (V1 - V0) * 1200 * 0.75; // hauteur proportionnelle (photo 4:3 vue a 1.2 km)
    const geo = new THREE.CylinderGeometry(1250, 1250, Y1 - Y0, 96, 1, true);
    const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - (V0 + uv.getY(i) * (V1 - V0)));
    // alpha (flipY=false, meme uv) : opaque pour uvY >= 0.50 (rive), transparent pour uvY <= 0.38 (ciel photo)
    const grd = g.createLinearGradient(0, 0, 0, 512); grd.addColorStop(0, '#000'); grd.addColorStop(0.38, '#000'); grd.addColorStop(0.50, '#fff'); grd.addColorStop(1, '#fff');
    g.fillStyle = grd; g.fillRect(0, 0, 4, 512);
    const alpha = new THREE.CanvasTexture(ac); alpha.flipY = false;
    const mat = new THREE.MeshBasicMaterial({ map: tex, alphaMap: alpha, transparent: true, side: THREE.BackSide, fog: false, depthWrite: false, toneMapped: true });
    const cyl = new THREE.Mesh(geo, mat); cyl.position.set(3, (Y0 + Y1) / 2, -19); cyl.rotation.y = Math.PI / 6; cyl.renderOrder = -1;
    scene.add(cyl);
  }
  const list = document.getElementById('cams');
  const order = ['ext_lac', 'ext_lac_est', 'ext_entree', 'ext_ouest', 'aerien', 'terrasse', 'spa', 'salon', 'salon_foyer', 'cuisine', 'cuisine_angle', 'sam', 'hall', 'escalier', 'chambre_principale', 'sdb_maitres', 'walkin', 'mudroom', 'salle_eau', 'familiale', 'gym', 'corridor', 'chambre3', 'sdb3', 'chambre4', 'sdb2', 'chambre2', 'lavage'];
  const names = order.filter(n => cams[n]);
  names.forEach(n => { const b = document.createElement('button'); b.dataset.n = n; b.textContent = n.replace(/_/g, ' '); b.onclick = () => goCam(n); list.appendChild(b); });
  document.getElementById('load').remove();
  goCam('ext_lac');
}, e => { if (e.total) { const p = Math.round(100 * e.loaded / e.total); bar.style.width = p + '%'; pct.textContent = p + ' %'; } });
document.getElementById('lights').onchange = e => lights.forEach(l => l.visible = e.target.checked);
document.getElementById('roof').onchange = e => roofParts.forEach(m => m.visible = e.target.checked);
const flyBox = document.getElementById('fly');
// ---- etat de vue : position + yaw/pitch
const pos = new THREE.Vector3(0, EYE, 20); let yaw = 0, pitch = 0; let level = 'rdc';
function goCam(n) {
  const c = cams[n]; if (!c) return;
  c.updateWorldMatrix(true, false);
  const p = new THREE.Vector3(), q = new THREE.Quaternion(); c.matrixWorld.decompose(p, q, new THREE.Vector3());
  pos.copy(p);
  const e = new THREE.Euler().setFromQuaternion(q, 'YXZ'); yaw = e.y; pitch = e.x;
  flyBox.checked = (n === 'aerien');
  level = (p.y < -1.0) ? 'rdj' : 'rdc';
  [...document.querySelectorAll('#cams button')].forEach(b => b.classList.toggle('on', b.dataset.n === n));
  setLevelUI();
  if (innerWidth < 800) document.body.classList.add('closed');
}
function setLevelUI() { [...document.querySelectorAll('#lvl button')].forEach(b => b.classList.toggle('on', b.dataset.l === level)); }
document.querySelectorAll('#lvl button').forEach(b => b.onclick = () => { level = b.dataset.l; pos.y = (level === 'rdc' ? RDC : RDJ) + EYE; setLevelUI(); });
// ---- regard : glisser (souris ou doigt), sans verrouillage
let drag = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const k = e.pointerType === 'touch' ? 0.0045 : 0.0032;
  yaw -= (e.clientX - drag.x) * k; pitch = Math.max(-1.45, Math.min(1.45, pitch - (e.clientY - drag.y) * k));
  drag.x = e.clientX; drag.y = e.clientY;
});
cv.addEventListener('pointerup', () => drag = null); cv.addEventListener('pointercancel', () => drag = null);
cv.addEventListener('wheel', e => { e.preventDefault(); move(-Math.sign(e.deltaY) * 0.9, 0); }, { passive: false });
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (['arrowup', 'arrowdown', ' '].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
document.querySelectorAll('#pad button').forEach(b => { const k = b.dataset.k; b.onpointerdown = e => { e.preventDefault(); keys[k] = true; }; b.onpointerup = b.onpointerleave = b.onpointercancel = () => keys[k] = false; });
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function move(f, r) {
  fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw)); right.set(Math.cos(yaw), 0, -Math.sin(yaw));
  if (flyBox.checked) { fwd.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)); }
  pos.addScaledVector(fwd, f).addScaledVector(right, r);
}
// ---- sol : rayon vers le bas sur les planchers/terrain, marche + escaliers
const ray = new THREE.Raycaster(); const down = new THREE.Vector3(0, -1, 0); const from = new THREE.Vector3();
function ground() {
  from.set(pos.x, pos.y + 0.6, pos.z);
  ray.set(from, down); ray.far = 6.0;
  const hits = ray.intersectObjects(floors, false);
  if (hits.length) {
    const h = hits.find(x => x.point.y <= pos.y + 0.5) || hits[0];
    return h.point.y;
  }
  return null;
}
const clock = new THREE.Clock();
function step(dt) {
  const sp = (keys.shift ? 4.5 : 2.0) * dt;
  let f = 0, r = 0;
  if (keys.w || keys.arrowup) f += 1; if (keys.s || keys.arrowdown) f -= 1;
  if (keys.a || keys.arrowleft) r -= 1; if (keys.d || keys.arrowright) r += 1;
  if (f || r) move(f * sp, r * sp);
  if (flyBox.checked) { if (keys.q || keys.e) pos.y += (keys.e ? 1 : -1) * sp; }
  else {
    const g = ground();
    const target = g !== null ? g + EYE : (level === 'rdc' ? RDC : RDJ) + EYE;
    pos.y += (target - pos.y) * Math.min(1, dt * 10);
    if (g !== null) level = (g < -1.0) ? 'rdj' : 'rdc';
  }
  camera.position.copy(pos);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  window.__pos = pos;
}
document.getElementById('tog').onclick = () => document.body.classList.toggle('closed');
function onResize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', onResize); addEventListener('orientationchange', () => setTimeout(onResize, 300));
(function loop() { requestAnimationFrame(loop); step(Math.min(clock.getDelta(), 0.05)); setLevelUI(); renderer.render(scene, camera); })();
</script>
</body>
</html>
